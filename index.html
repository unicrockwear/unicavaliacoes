<script>
const $=i=>document.getElementById(i);
const D={ac:'#f5c400',bg:'#000000',tx:'#ffffff',n1:'Unic',n2:'Rockwear',b:[null,null,null],r:[],n:0,cards:{},cd:{},pct:10,logo:null,bands:[],audioData:null};

let S = Object.assign({}, D); 

const firebaseConfig = {
  apiKey: "AIzaSyAr9YtNP8cHzEQea2JR3BJKYpHzFH1PeHM",
  authDomain: "unicavaliacoes-4d696.firebaseapp.com",
  databaseURL: "https://unicavaliacoes-4d696-default-rtdb.firebaseio.com",
  projectId: "unicavaliacoes-4d696",
  storageBucket: "unicavaliacoes-4d696.firebasestorage.app",
  messagingSenderId: "758903831774",
  appId: "1:758903831774:web:2ca92c96cc90a04518564f"
};
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

const esc = t => { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };

let audioInitialized = false;

// Sincronização em tempo real corrigida para puxar o array 'r' de avaliações do Firebase
db.ref('unic_dados').on('value', (snapshot) => {
  const data = snapshot.val();
  if (data) {
    const oldAudio = S.audioData;
    S = Object.assign({}, D, data);
    S.b = S.b || [null,null,null];
    S.r = S.r || [];
    S.cards = S.cards || {};
    S.cd = S.cd || {};
    S.bands = S.bands || [];
    
    theme(); 
    car();   
    rend();  // Força a atualização imediata da lista de avaliações
    
    if (oldAudio !== S.audioData || !audioInitialized) {
      loadAudio();
      audioInitialized = true;
    }
  }
});

const save = () => { return db.ref('unic_dados').set(S); };

const BANDS='Metallica Iron Maiden AC/DC Guns N\' Roses Nirvana Linkin Park Misfits Kiss Queen Black Sabbath Pink Floyd Led Zeppelin Ramones Slayer Megadeth Pantera Ozzy Osbourne Rolling Stones The Doors Scorpions Aerosmith Bon Jovi Rush Deep Purple ';
$('bgt').textContent=BANDS.repeat(6);

function theme(){const r=document.documentElement.style;r.setProperty('--ac',S.ac);r.setProperty('--bg',S.bg);r.setProperty('--tx',S.tx);
$('bn').textContent=S.n1;$('bs').textContent=S.n2;$('dsc').textContent=S.pct;$('dsc2').textContent=S.pct;$('dsc3').textContent=S.pct;
const l=$('logo');if(S.logo){l.src=S.logo;l.style.display='block';$('brand').style.display='none'}else{l.style.display='none';$('brand').style.display=''}
$('bgi').innerHTML='';S.bands.forEach(b=>{const d=document.createElement('div');d.style.backgroundImage='url('+b+')';$('bgi').appendChild(d)})}

let ci=0,ct;
function car(){const t=$('trk');t.innerHTML='';$('dots').innerHTML='';
S.b.forEach((b,i)=>{const d=document.createElement('div');if(b)d.style.backgroundImage='url('+b+')';else d.textContent='BANNER 1920×850';t.appendChild(d);
const o=document.createElement('i');o.onclick=()=>go(i);$('dots').appendChild(o)});go(ci)}
function go(i){ci=i%3;$('trk').style.transform='translateX(-'+ci*100+'%)';[...$('dots').children].forEach((d,j)=>d.classList.toggle('on',j==ci));clearInterval(ct);ct=setInterval(()=>go(ci+1),5000)}

const fmt=t=>{const o={timeZone:'America/Sao_Paulo'},d=new Date(t);return d.toLocaleDateString('pt-BR',{...o,day:'2-digit',month:'2-digit',year:'numeric'})+' às '+d.toLocaleTimeString('pt-BR',{...o,hour:'2-digit',minute:'2-digit'})};
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}

function rend(){
  // Pega todas as avaliações que não estejam marcadas como ocultas (h !== 1)
  const v = (S.r || []).filter(x => !x.h);
  const a = v.length ? v.reduce((s,x)=>s+(x.s||5),0)/v.length : 5.0;
  
  $('avg').textContent = a.toFixed(1).replace('.',',');
  $('avst').textContent = stars(Math.round(a));
  $('cnt').textContent = v.length + (v.length == 1 ? ' avaliação' : ' avaliações');
  
  const L = $('list');
  L.innerHTML = v.length ? '' : '<p style="color:#777; padding: 10px;">Seja o primeiro a avaliar!</p>';
  
  v.slice().reverse().forEach(x => {
    const e = document.createElement('div');
    e.className = 'rv';
    const av = x.p ? '<img src="'+x.p+'" alt="">' : '<div class="av"><svg viewBox="0 0 24 24" width="26" height="26" fill="#888" aria-label="Usuário"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21c0-4.7 3.8-8 8.5-8s8.5 3.3 8.5 8z"/></svg></div>';
    const ig = x.ig ? '<a class="ig" href="https://www.instagram.com/'+esc(x.ig)+'/" target="_blank" rel="noopener">@'+esc(x.ig)+'</a>' : '';
    e.innerHTML = av + '<div><b>'+esc(x.n || 'Cliente')+'</b>'+ig+'<span class="dt">'+esc(x.t?fmt(x.t):(x.d||''))+'</span><div class="st">'+stars(x.s || 5)+'</div><p>'+esc(x.c || '')+'</p></div>';
    L.appendChild(e);
  });
}
</script>
