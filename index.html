<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliações | Unic Rockwear</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #161616;
            --accent: #f5c400;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #262626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin: 30px 0;
        }

        header h1 {
            font-weight: 900;
            font-size: 2rem;
            letter-spacing: 2px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        header h1 span {
            color: var(--accent);
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 8px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .reviewer-name {
            font-weight: 800;
            font-size: 1.1rem;
        }

        .review-stars {
            color: var(--accent);
            font-size: 0.9rem;
        }

        .review-text {
            color: #dddddd;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .review-media {
            width: 100%;
            border-radius: 8px;
            max-height: 350px;
            object-fit: cover;
            margin-top: 10px;
        }

        .btn-action {
            display: inline-block;
            width: 100%;
            background-color: var(--accent);
            color: #000000;
            font-weight: 800;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.95rem;
            transition: opacity 0.2s;
            margin-top: 10px;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        /* Player Flutuante de Áudio */
        #audio-trigger {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent);
            color: #000;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            cursor: pointer;
            z-index: 1000;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Unic <span>Rockwear</span></h1>
        <p>O que os nossos clientes estão dizendo</p>
    </header>

    <div class="container" id="reviews-container">
        <!-- As avaliações carregadas do Firebase aparecerão aqui dinamicamente -->
        <p style="text-align: center; color: var(--text-muted);">Carregando avaliações...</p>
    </div>

    <!-- Botão/Indicador de Áudio -->
    <div id="audio-trigger" title="Ativar Som">
        <i class="fa-solid fa-music" id="audio-icon"></i>
    </div>

    <!-- Elemento de Áudio Oculto -->
    <audio id="bg-audio" loop></audio>

    <script>
        // Configuração do Firebase (Substitua com suas credenciais do projeto)
        const firebaseConfig = {
            databaseURL: "https://unicavaliacoes-4d696-default-rtdb.firebaseio.com/"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();

        // Carregar configurações globais e avaliações
        db.ref('unic_dados').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // Ajustar cor de destaque dinamicamente se houver no banco
            if (data.ac) {
                document.documentElement.style.setProperty('--accent', data.ac);
            }

            // Configurar Áudio se presente
            if (data.audioData) {
                const audioElement = document.getElementById('bg-audio');
                if (audioElement.src !== data.audioData) {
                    audioElement.src = data.audioData;
                }
            }

            // Renderizar Avaliações
            const container = document.getElementById('reviews-container');
            container.innerHTML = '';

            const avaliacoes = data.avaliacoes || data.reviews || {};
            const keys = Object.keys(avaliacoes);

            if (keys.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Nenhuma avaliação cadastrada no momento.</p>';
                return;
            }

            keys.forEach(key => {
                const rev = avaliacoes[key];
                // Verifica se está aprovada (caso use moderação) ou exibe direto
                if (rev.status && rev.status !== 'aprovado') return;

                const card = document.createElement('div');
                card.className = 'card';

                let starsHtml = '';
                const rating = rev.rating || 5;
                for (let i = 0; i < rating; i++) {
                    starsHtml += '<i class="fa-solid fa-star"></i>';
                }

                card.innerHTML = `
                    <div class="review-header">
                        <span class="reviewer-name">${rev.nome || 'Cliente Unic'}</span>
                        <div class="review-stars">${starsHtml}</div>
                    </div>
                    <p class="review-text">${rev.texto || rev.comentario || ''}</p>
                    ${rev.imagem ? `<img src="\${rev.imagem}" class="review-media" alt="Foto da avaliação">` : ''}
                `;
                container.appendChild(card);
            });
        });

        // Controle de Reprodução de Áudio por Interação do Usuário
        const audioTrig = document.getElementById('audio-trigger');
        const bgAudio = document.getElementById('bg-audio');
        const audioIcon = document.getElementById('audio-icon');
        let isPlaying = false;

        audioTrig.addEventListener('click', () => {
            if (!isPlaying) {
                bgAudio.play().then(() => {
                    isPlaying = true;
                    audioIcon.className = "fa-solid fa-volume-high";
                    audioTrig.style.background = "#fff";
                }).catch(e => console.log("Erro ao reproduzir áudio:", e));
            } else {
                bgAudio.pause();
                isPlaying = false;
                audioIcon.className = "fa-solid fa-music";
                audioTrig.style.background = "var(--accent)";
            }
        });
    </script>
</body>
</html>
