<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliações | Unic Rockwear</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #121212;
            --accent: #f5c400;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #262626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Bar */
        header {
            width: 100%;
            background-color: #000000;
            border-bottom: 2px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 900;
            font-size: 1.4rem;
            letter-spacing: 1px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .logo span {
            color: var(--accent);
        }

        .btn-top {
            background-color: var(--accent);
            color: #000000;
            font-weight: 800;
            padding: 10px 18px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            transition: opacity 0.2s;
        }

        .btn-top:hover {
            opacity: 0.9;
        }

        /* Layout Principal em Grid */
        .main-container {
            width: 100%;
            max-width: 1200px;
            padding: 30px 20px;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        /* Bloco de Resumo da Nota */
        .summary-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .summary-score {
            font-size: 3rem;
            font-weight: 900;
            color: var(--text-main);
        }

        .summary-stars {
            color: var(--accent);
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .summary-count {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Seção Opiniões da Galera */
        .section-title {
            font-size: 1rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .reviews-list {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .review-item {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .review-item:last-child {
            border-bottom: none;
        }

        .reviewer-avatar {
            width: 40px;
            height: 40px;
            background-color: #2a2a2a;
            color: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .review-content {
            flex-grow: 1;
        }

        .review-header-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .reviewer-name {
            font-weight: 800;
            font-size: 0.95rem;
        }

        .review-date {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .review-stars-small {
            color: var(--accent);
            font-size: 0.75rem;
            margin-bottom: 8px;
        }

        .review-text {
            color: #dcdcdc;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* Coluna Lateral - Destaques */
        .sidebar-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            height: fit-content;
        }

        .sidebar-banner {
            width: 100%;
            height: 320px;
            background-color: #1a1a1a;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        /* Player Flutuante de Áudio */
        #audio-trigger {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent);
            color: #000;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            cursor: pointer;
            z-index: 1000;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Unic <span>Rockwear</span></div>
        <a href="#" class="btn-top" onclick="alert('Abra sua página de envio de avaliação cadastrada.'); return false;">Deixar Avaliação</a>
    </header>

    <div class="main-container">
        <!-- Coluna Esquerda: Estatísticas e Avaliações -->
        <div>
            <div class="summary-box">
                <div class="summary-score" id="average-score">5.0</div>
                <div>
                    <div class="summary-stars">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                    </div>
                    <div class="summary-count" id="total-count">Carregando avaliações...</div>
                </div>
            </div>

            <div class="section-title">Opiniões da Galera</div>
            <div class="reviews-list" id="reviews-container">
                <!-- Conteúdo injetado via Firebase -->
            </div>
        </div>

        <!-- Coluna Direita: Destaques Unic -->
        <div class="sidebar-box">
            <div class="section-title">Destaques Unic</div>
            <div class="sidebar-banner">
                Unic Rockwear — Custom Apparel
            </div>
        </div>
    </div>

    <!-- Indicador de Áudio -->
    <div id="audio-trigger" title="Ativar Som">
        <i class="fa-solid fa-music" id="audio-icon"></i>
    </div>
    <audio id="bg-audio" loop></audio>

    <script>
        const firebaseConfig = {
            databaseURL: "https://unicavaliacoes-4d696-default-rtdb.firebaseio.com/"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.database();

        db.ref('unic_dados').on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            if (data.ac) {
                document.documentElement.style.setProperty('--accent', data.ac);
            }

            if (data.audioData) {
                const audioElement = document.getElementById('bg-audio');
                if (audioElement.src !== data.audioData) {
                    audioElement.src = data.audioData;
                }
            }

            const container = document.getElementById('reviews-container');
            container.innerHTML = '';

            const avaliacoes = data.avaliacoes || data.reviews || {};
            const keys = Object.keys(avaliacoes);

            if (keys.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted);">Nenhuma avaliação encontrada.</div>';
                document.getElementById('total-count').innerText = '0 avaliações de clientes';
                return;
            }

            document.getElementById('total-count').innerText = `${keys.length} avaliações de clientes`;

            // Puxar todas as avaliações sem restrições
            keys.forEach(key => {
                const rev = avaliacoes[key];
                const nome = rev.nome || 'Cliente Unic';
                const inicial = nome.charAt(0).toUpperCase();
                const texto = rev.texto || rev.comentario || '';
                const dataStr = rev.data || '';
                const rating = rev.rating || 5;

                let starsHtml = '';
                for (let i = 0; i < rating; i++) {
                    starsHtml += '<i class="fa-solid fa-star"></i>';
                }

                const item = document.createElement('div');
                item.className = 'review-item';
                item.innerHTML = `
                    <div class="reviewer-avatar">${inicial}</div>
                    <div class="review-content">
                        <div class="review-header-line">
                            <span class="reviewer-name">${nome}</span>
                            <span class="review-date">${dataStr}</span>
                        </div>
                        <div class="review-stars-small">${starsHtml}</div>
                        <p class="review-text">${texto}</p>
                        ${rev.imagem ? `<img src="\${rev.imagem}" style="width:100%; border-radius:6px; margin-top:10px; max-height:250px; object-fit:cover;" alt="Foto cliente">` : ''}
                    </div>
                `;
                container.appendChild(item);
            });
        });

        // Controlo de Áudio
        const audioTrig = document.getElementById('audio-trigger');
        const bgAudio = document.getElementById('bg-audio');
        const audioIcon = document.getElementById('audio-icon');
        let isPlaying = false;

        audioTrig.addEventListener('click', () => {
            if (!isPlaying) {
                bgAudio.play().then(() => {
                    isPlaying = true;
                    audioIcon.className = "fa-solid fa-volume-high";
                    audioTrig.style.background = "#fff";
                }).catch(e => console.log("Erro ao reproduzir:", e));
            } else {
                bgAudio.pause();
                isPlaying = false;
                audioIcon.className = "fa-solid fa-music";
                audioTrig.style.background = "var(--accent)";
            }
        });
    </script>
</body>
</html>
