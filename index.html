<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unic Rockwear — Avaliações</title>
<style>
:root{--ac:#f5c400;--bg:#000;--tx:#fff;--gr:#cfcfcf;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,sans-serif;display:flex;flex-direction:column;height:100vh;overflow:hidden;position:relative;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,.bl{font-family:"Arial Black",Arial,sans-serif;text-transform:uppercase;letter-spacing:1px}
#bgw{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bgt{position:absolute;inset:-20px;font-family:"Arial Black";font-size:9vh;line-height:1.05;color:#fff;opacity:.045;word-break:break-all;text-transform:uppercase}
#bgi{position:absolute;left:0;right:0;bottom:0;height:70%;display:flex;opacity:.4;filter:grayscale(1) contrast(1.1);-webkit-mask-image:linear-gradient(to top,#000 0%,transparent 90%);mask-image:linear-gradient(to top,#000 0%,transparent 90%)}
#bgi div{flex:1;background:center/cover;-webkit-mask-image:linear-gradient(to right,transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(to right,transparent,#000 25%,#000 75%,transparent)}
header,main,footer{position:relative;z-index:1}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 22px;border-bottom:2px solid var(--ac);background:#000c}
.lg{display:flex;align-items:center;gap:12px}
#logo{height:52px;max-width:180px;object-fit:contain;display:none}
header h1{margin:0;font-size:26px;cursor:pointer;user-select:none}
header h1 span{color:var(--ac)}header h1 em{font-style:normal}
button,.btn{background:var(--ac);color:#000;border:0;padding:9px 16px;font-family:"Arial Black",Arial;text-transform:uppercase;font-size:12px;cursor:pointer;border-radius:3px}
button.g{background:#222;color:var(--gr);border:1px solid #444}
button.r{background:#a11;color:#fff}
#radio{display:none;align-items:center;gap:12px;color:#c0c0c0;font-family:"Arial Black",Arial;font-size:13px;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
#radio.has{display:flex}
#eq{display:flex;align-items:flex-end;gap:3px;height:28px;padding:3px 5px;background:#0a0a0a;border:1px solid #555;border-radius:3px}
#eq i{display:block;width:5px;height:20%;background:repeating-linear-gradient(to top,#c0c0c0 0 3px,transparent 3px 5px);animation:eq 1s ease-in-out infinite alternate;animation-play-state:paused}
#radio.on #eq i{animation-play-state:running}
@keyframes eq{0%{height:15%}30%{height:80%}60%{height:45%}100%{height:100%}}
main{flex:1;min-height:0;display:grid;grid-template-columns:1.45fr 1fr;gap:16px;padding:14px 22px}
.col{display:flex;flex-direction:column;gap:12px;min-height:0}
#car{position:relative;overflow:hidden;aspect-ratio:1920/850;background:#111;border:1px solid #333;flex:none}
#trk{display:flex;height:100%;transition:transform .6s}
#trk>div{min-width:100%;height:100%;background:#111 center/cover;display:flex;align-items:center;justify-content:center;color:#555;font-family:"Arial Black";font-size:clamp(12px,2vw,26px)}
#dots{position:absolute;bottom:8px;width:100%;text-align:center}
#dots i{display:inline-block;width:10px;height:10px;margin:0 4px;border-radius:50%;background:#666;cursor:pointer}
#dots i.on{background:var(--ac)}
.card{background:#000a;border:1px solid #2f2f2f;padding:14px 16px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
h2{font-size:16px;margin:0 0 8px;color:var(--ac)}
.sum{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between}
.sum>div:first-child{display:flex;align-items:center;gap:14px}
.big{font-family:"Arial Black";font-size:46px;line-height:1}
.st{color:var(--ac);letter-spacing:2px}
.rc{flex:1;min-height:0;display:flex;flex-direction:column}
#list{flex:1;min-height:0;overflow-y:auto;padding-right:6px}
.rv{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #222}
.rv img,.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:#333;flex:none;display:flex;align-items:center;justify-content:center;font-family:"Arial Black";color:var(--ac)}
.rv b{font-family:"Arial Black"}.rv small{color:#888}
.rv p{margin:3px 0 0;color:var(--gr);white-space:pre-wrap;word-break:break-word;font-size:14px}
input,select,textarea{background:#111;color:#fff;border:1px solid #444;padding:9px;font-family:Arial;width:100%;margin:4px 0 10px;border-radius:3px}
label{font-size:12px;color:var(--gr)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
</style>
</head>
<body>

</body>
</html>
